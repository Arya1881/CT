services:
  api:
    build: .
    image: campustransit:latest
    container_name: campustransit
    ports:
      - "4000:4000"
    environment:
      # Runs on the built-in in-memory demo store out of the box.
      # To use Postgres instead, set DATABASE_URL and uncomment the db service below.
      PORT: "4000"
      # DATABASE_URL: postgresql://campustransit:campustransit@db:5432/campustransit
    restart: unless-stopped
    # depends_on:
